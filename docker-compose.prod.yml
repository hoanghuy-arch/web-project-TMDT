# docker-compose.prod.yml — Cấu hình triển khai Production cho SportZone
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD chưa được đặt}
      MYSQL_DATABASE: sportzone
      MYSQL_USER: sportzone
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD chưa được đặt}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sportzone", "-p$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://sportzone:${MYSQL_PASSWORD}@db:3306/sportzone?charset=utf8mb4
      FLASK_DEBUG: "0"
      FLASK_ENV: production
    volumes:
      - uploads_data:/app/app/static/uploads
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/srv/static:ro
      - uploads_data:/srv/static/uploads:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - internal

  certbot:
    image: certbot/certbot
    restart: "no"
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
  logs_data:
  certbot_www:
  certbot_conf:
