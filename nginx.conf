# nginx.conf — SportZone reverse proxy
# Đặt tại thư mục gốc dự án, mount vào /etc/nginx/conf.d/default.conf

upstream sportzone_app {
    server app:8000;        # tên service trong docker-compose
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;   # upload ảnh sản phẩm

    # ----- Static files: Nginx phục vụ trực tiếp (không qua Gunicorn) -----
    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ----- Healthcheck endpoint (bypass logging) -----
    location = /health {
        proxy_pass http://sportzone_app;
        access_log off;
    }

    # ----- Toàn bộ request còn lại chuyển cho Gunicorn -----
    location / {
        proxy_pass http://sportzone_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ----- Security headers -----
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header X-Frame-Options         "SAMEORIGIN"        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
