{# Khu vực mua hàng ở trang chi tiết. Biến thể đang chọn nằm ở #variant_id (product.js cập nhật). #}
{% if not current_user.is_authenticated %}
  <a href="{{ url_for('auth.login', next=request.path) }}" class="btn btn-sz btn-lg">
    <i class="bi bi-box-arrow-in-right"></i> Đăng nhập để mua hàng
  </a>
{% elif current_user.role_code != 'CUSTOMER' %}
  <div class="alert alert-info mb-0">Tài khoản nhân viên/quản trị viên không dùng để mua hàng.</div>
{% else %}
  <form method="post" action="{{ url_for('account.cart_add') }}" id="add-to-cart-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="variant_id" id="variant_id" value="">
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <label for="quantity" class="visually-hidden">Số lượng</label>
      <input type="number" name="quantity" id="quantity" value="1" min="1" max="1" class="form-control" style="width: 90px;" disabled>
      <button type="submit" id="add-to-cart-btn" class="btn btn-sz btn-lg" disabled>
        <i class="bi bi-bag-plus"></i> Thêm vào giỏ hàng
      </button>
    </div>
  </form>
{% endif %}
