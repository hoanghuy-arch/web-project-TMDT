{# Menu bên trái của khu vực tài khoản. active: profile | addresses | password #}
{% macro account_nav(active) -%}
<div class="list-group shadow-sm mb-3">
  <a href="{{ url_for('account.profile') }}" class="list-group-item list-group-item-action {{ 'active' if active == 'profile' }}"><i class="bi bi-person"></i> Hồ sơ của tôi</a>
  {% if current_user.role_code == 'CUSTOMER' %}
  <a href="{{ url_for('account.orders') }}" class="list-group-item list-group-item-action {{ 'active' if active == 'orders' }}"><i class="bi bi-receipt"></i> Đơn của tôi</a>
  <a href="{{ url_for('account.addresses') }}" class="list-group-item list-group-item-action {{ 'active' if active == 'addresses' }}"><i class="bi bi-geo-alt"></i> Sổ địa chỉ</a>
  {% endif %}
  <a href="{{ url_for('account.change_password') }}" class="list-group-item list-group-item-action {{ 'active' if active == 'password' }}"><i class="bi bi-shield-lock"></i> Đổi mật khẩu</a>
</div>
{%- endmacro %}
