# nginx.prod.conf — Reverse proxy Production cho SportZone (Hỗ trợ SSL Let's Encrypt)

upstream sportzone_app {
    server app:8000;
}

# --- Cổng 80: Dành cho xác thực Let's Encrypt HTTP-01 và chuyển hướng sang HTTPS ---
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Cổng 443: HTTPS với chứng chỉ SSL và Security Headers ---
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/sportzone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportzone/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # Static files phục vụ trực tiếp
    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Healthcheck endpoint (không ghi log)
    location = /health {
        proxy_pass http://sportzone_app;
        access_log off;
    }

    # Reverse proxy tới Gunicorn App
    location / {
        proxy_pass http://sportzone_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Security headers chuẩn OWASP
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
